<style>

.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:22px 24px;box-shadow:0 2px 8px rgba(15,23,42,.05);margin-bottom:16px}

.btn:hover{background:#2d8400}.btn.sec{background:#fff;color:var(--t);border:1px solid #cbd5e1}.btn.sec:hover{background:#f8fafc}.btn.warn{background:var(--n)}

.q{font-size:15.5px;margin:6px 0 16px}.tema{display:inline-block;font-size:11px;font-weight:800;color:var(--vd);background:var(--vb);border-radius:10px;padding:2px 10px}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--b);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer;background:#f8fafc}

.fila:first-of-type{border-top:0}.fila p{margin:0;font-size:13.5px}select{width:100%;padding:9px;border-radius:8px;border:1px solid #cbd5e1;font-size:13.5px;background:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.score{font-size:42px;font-weight:900;color:var(--vd);margin:0}.pct{color:var(--m);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--b);padding:8px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;font-size:12px}
.ok{color:#15803d;font-weight:800}.no{color:var(--r);font-weight:800}.par{color:#b45309;font-weight:800}
.tm{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:13.5px}.tm .bar{margin:0}

<script>
const Q = [{"n": 1, "tipo": "mc", "tema": "Analítica de datos y modelos matemáticos", "q": "Son todas las acciones que permiten recolectar, administrar, gestionar y analizar, con el objeto de buscar oportunidades de negocio en el mercado.", "ops": ["Analítica de datos.", "Modelo matemático.", "Arreglo.", "Teoría."], "ok": 0, "exp": "La analítica de datos reúne las acciones de recolectar, administrar, gestionar y analizar datos para encontrar oportunidades de negocio."}, {"n": 2, "tipo": "mc", "tema": "Analítica de datos y modelos matemáticos", "q": "Es la representación simbólica en lenguaje o términos matemáticos, de cualquier evento o fenómeno físico, químico, económico, social o tecnológico.", "ops": ["Sistema cerrado.", "Sistema abierto.", "Modelo matemático.", "Big data."], "ok": 2, "exp": "Un modelo matemático representa simbólicamente un evento o fenómeno con lenguaje matemático."}, {"n": 3, "tipo": "mc", "tema": "Analítica de datos y modelos matemáticos", "q": "¿Cuál es una característica de un modelo matemático?", "ops": ["Que sea un sistema.", "Qué sea bonito.", "Qué sea simple.", "Qué sea análogo."], "ok": 2, "exp": "Un modelo matemático es una representación simplificada de la realidad."}, {"n": 4, "tipo": "mc", "tema": "Estadística descriptiva e inferencial", "q": "Es la rama de la matemática que recoge, organiza, jerarquiza, ordena, clasifica y analiza datos e información.", "ops": ["Modelo matemático.", "Geometría analítica.", "Algebra lineal.", "Estadística descriptiva."], "ok": 3, "exp": "La estadística descriptiva recoge, organiza y analiza los datos para describirlos."}, {"n": 5, "tipo": "mc", "tema": "Tipos de variables", "q": "Esta variable adquiere características que se pueden expresar con valores numéricos; pueden ser de tipo discreto (se expresan números enteros naturales, por ejemplo, el número de personas en un cine, la cantidad vehículos en un parqueadero. o continuas (se expresan con números decimales, como el peso, la estatura o la velocidad).", "ops": ["Variable cuantitativa.", "Variable cualitativa.", "Variable ordinal.", "Variable cardinal."], "ok": 0, "exp": "La variable cuantitativa se expresa con números y puede ser discreta o continua."}, {"n": 6, "tipo": "mc", "tema": "Tipos de variables", "q": "Esta variable toma atributos que describen cualidades y características específicas de una población objeto de estudio sin utilizar parámetros numéricos; estas variables pueden ser ordinales (se refieren a un tipo de orden o secuencia, por ejemplo, la selección Colombia de baloncesto quedó de primera en la serie, alto, medio, bajo, generan algún tipo de nivel a seguir). Nominales (se refieren a atributos como el color de un objeto, la intensidad de este, o los sabores que se pueden apreciar en las comidas, no tienen jerarquías).", "ops": ["Variable cuantitativa.", "Variable cualitativa.", "Variable discreta.", "Variable continua."], "ok": 1, "exp": "La variable cualitativa describe cualidades y puede ser ordinal o nominal."}, {"n": 7, "tipo": "mc", "tema": "Tablas y gráficos", "q": "Después de recolectar datos, ordena, jerarquiza y clasifica los datos recolectados que pueden ser cualitativos o cuantitativos, procurando asignar las cantidades correspondientes por intervalos o categorías asignadas, para análisis e informes posteriores, de acuerdo con las necesidades requeridas.", "ops": ["Tabla de datos.", "Tabla de frecuencias.", "Tabla discreta.", "Tabla dinámica."], "ok": 1, "exp": "La tabla de frecuencias clasifica los datos por intervalos o categorías."}, {"n": 8, "tipo": "mc", "tema": "Tablas y gráficos", "q": "Es un gráfico de barras que representa los datos de la tabla de frecuencia, el ancho de cada barra es el intervalo es el ancho de cada intervalo (marca de clase), para el caso de datos continuos (cada evento es el ancho de barra para datos discretos). El alto de cada barra es la frecuencia (número de veces que se repite el evento).", "ops": ["Tabla de datos.", "Tabla de frecuencias.", "Histograma.", "Tabla dinámica."], "ok": 2, "exp": "El histograma es el gráfico de barras de la tabla de frecuencias."}, {"n": 9, "tipo": "mc", "tema": "Medidas de tendencia central y dispersión", "q": "También conocida como promedio, es el valor que se obtiene al dividir la suma de un grupo de datos entre la cantidad de ellos. La media aritmética o promedio representa el reparto equitativo, el equilibrio, la equidad. Es el valor que tendrían los datos, si todos ellos fueran iguales. O, también, el valor que correspondería a cada uno de los datos de la distribución si su suma total se repartiera por igual.", "ops": ["Desviación estándar.", "Mediana.", "Media Aritmética.", "Moda."], "ok": 2, "exp": "La media aritmética es la suma de los datos dividida entre su cantidad."}, {"n": 10, "tipo": "mc", "tema": "Medidas de tendencia central y dispersión", "q": "Si se ordenan todos los datos, de menor a mayor, es el valor que ocupa la posición central. Si el número de datos es par, es la media aritmética de los dos centrales.", "ops": ["Desviación estándar.", "Mediana.", "Media Aritmética.", "Moda."], "ok": 1, "exp": "La mediana es el valor central de los datos ordenados."}, {"n": 11, "tipo": "mc", "tema": "Medidas de tendencia central y dispersión", "q": "Es el valor que más se repite o, lo que es lo mismo, el que tiene la mayor frecuencia.", "ops": ["Desviación estándar.", "Mediana.", "Media Aritmética.", "Moda."], "ok": 3, "exp": "La moda es el valor con mayor frecuencia."}, {"n": 12, "tipo": "mc", "tema": "Medidas de tendencia central y dispersión", "q": "Este parámetro es variable, mide realmente que tan lejana está la distribución de datos con respecto a un parámetro de medida central, aumenta conforme aumenta la dispersión.", "ops": ["Desviación estándar.", "Varianza.", "Media geométrica.", "Moda."], "ok": 0, "exp": "Mide qué tan lejos están los datos de la medida central."}, {"n": 13, "tipo": "mc", "tema": "Medidas de tendencia central y dispersión", "q": "Es la raíz cuadrada que se desprende de una desviación estándar, la cual permite que las industrias de manufactura puedan trabajar con precisión en su producción y reduzcan su índice de errores.", "ops": ["Desviación estándar.", "Varianza.", "Media geométrica.", "Moda."], "ok": 1, "exp": ""}, {"n": 14, "tipo": "mc", "tema": "Estadística descriptiva e inferencial", "q": "Esta parte de la estadística está encargada de hacer deducciones a partir de muestras (que deben tener todas las características y propiedades de la población); de allí mide tendencias, infiere propiedades y hasta define conclusiones.", "ops": ["Estadística descriptiva.", "Estadística estocástica.", "Inferencia estadística.", "Procesos estocásticos."], "ok": 2, "exp": "La inferencia estadística deduce a partir de muestras."}, {"n": 15, "tipo": "mc", "tema": "Big data, datos e información", "q": "Es un término que se encuentra presente en todas las vidas de todos a diario, viene en cada dispositivo que tenga alguna conexión a Internet, un teléfono, un televisor, una nevera, una cámara de video, la domótica de la casa, una máquina que regule el caudal de agua de un río, envía una señal de límites superiores e inferiores del río, el caudal de agua por unidad de tiempo, todas ellas enviando información cada 24-7 en 365 días al año, sin descanso, generando espacios y cantidades de información que manualmente sería imposible de gestionar.", "ops": ["Minería de datos.", "Big data.", "Dato.", "Informática."], "ok": 1, "exp": "Big data: grandes cantidades de información generadas sin descanso."}, {"n": 16, "tipo": "mc", "tema": "Big data, datos e información", "q": "Apache Hadoop es una de las precursoras, utilizada por Facebook, de código abierto (gratis), predictiva y con alto nivel de seguridad.", "ops": ["Verdadero", "Falso"], "ok": 1, "exp": ""}, {"n": 17, "tipo": "mc", "tema": "Analítica de datos y modelos matemáticos", "q": "Los modelos matemáticos son conceptos simbólicos de carácter muy amplio o muy cerrado, que igualmente hace que sean muy diversos, haciéndolos a veces difíciles de caracterizar, parametrizar y mucho menos estandarizar.", "ops": ["Verdadero", "Falso"], "ok": 1, "exp": ""}, {"n": 18, "tipo": "mc", "tema": "Estadística descriptiva e inferencial", "q": "Se parte del concepto más sencillo, que es la rama de la matemática que recoge, organiza, jerarquiza (si es necesario), ordena, clasifica y analiza datos e información. (Es el concepto de Tabla dinámica).", "ops": ["Verdadero", "Falso"], "ok": 0, "exp": ""}, {"n": 19, "tipo": "mc", "tema": "Tipos de variables", "q": "Variable cuantitativa es la variable que adquiere características que se pueden expresar con valores numéricos, pueden ser de tipo discreto (se expresan generalmente con números enteros naturales por ejemplo: el número de personas en un cine, la cantidad vehículos en un parqueadero. o continuas (se expresan generalmente con números decimales como: el peso, la estatura o la velocidad).", "ops": ["Verdadero", "Falso"], "ok": 1, "exp": ""}, {"n": 20, "tipo": "mc", "tema": "Medidas de tendencia central y dispersión", "q": "Los parámetros de tendencia central son números que se ubican buscando el centro de la distribución (concentración. de los datos de un grupo de observaciones agrupadas o no agrupadas. Las más utilizadas y conocidas son la media (aritmética o geométrica), la mediana y la moda.", "ops": ["Verdadero", "Falso"], "ok": 1, "exp": ""}, {"n": 21, "tipo": "mc", "tema": "Big data, datos e información", "q": "La información primaria que inicialmente fue útil para algún estudio después con algunos ajustes, depuraciones, se vuelve información secundaria que también puede ser útil para otros estudios posteriores. Generalmente es de uso público. Se vuelven la única referencia cuando es imposible obtener información de tipo primario. (Es el concepto de información primaria).", "ops": ["Verdadero", "Falso"], "ok": 0, "exp": ""}, {"n": 22, "tipo": "mc", "tema": "Tablas y gráficos", "q": "Utiliza la metodología del plano cartesiano para generar un arreglo de dos ejes que se cruzan (eje X y eje Y), es el concepto de gráfico circular.", "ops": ["Verdadero", "Falso"], "ok": 0, "exp": ""}, {"n": 23, "tipo": "mc", "tema": "Población y muestreo", "q": "La población objeto de estudio debe guardar unos parámetros o características heterogéneas, que permitan agrupar a estos bajo unos criterios específicos que permitan obtener un comportamiento similar ante una varias situaciones o eventos.", "ops": ["Verdadero", "Falso"], "ok": 0, "exp": ""}, {"n": 24, "tipo": "mc", "tema": "Población y muestreo", "q": "Muestra aleatoria sistemática es un conjunto de variables aleatorias independientes e idénticamente distribuidas obtenidas a partir de la variable aleatoria X que se distribuyen igual que la misma.", "ops": ["Verdadero", "Falso"], "ok": 0, "exp": ""}, {"n": 25, "tipo": "mc", "tema": "Big data, datos e información", "q": "“Una decisión es la determinación para actuar ante una situación que presenta solo una alternativa. La palabra proviene del latín decisio, qué significa opción tomada entre otras posibilidades”.", "ops": ["Verdadero", "Falso"], "ok": 0, "exp": ""}, {"n": 26, "tipo": "mc", "tema": "Big data, datos e información", "q": "Datos estructurados son los datos con los que se pueden construir bases de datos generando campos y registros los cuales son veraces, que se pueden relacionar y articular con otras bases de datos de diferentes fuentes, estos son datos cuantitativos.", "ops": ["Verdadero", "Falso"], "ok": 1, "exp": ""}, {"n": 27, "tipo": "mc", "tema": "Big data, datos e información", "q": "Un sistema centralizado, en el que todos los datos residen en una única ubicación y los usuarios pueden acceder a dicha ubicación para manipular los datos.", "ops": ["Verdadero", "Falso"], "ok": 1, "exp": ""}, {"n": 28, "tipo": "match", "tema": "Analítica de datos y modelos matemáticos", "q": "Relacione la columna A con la B de acuerdo al tipo de modelo matemático que enuncia.", "filas": [{"t": "Heurísticos: se centran en las causas, se estudian los orígenes de los fenómenos de causa natural. Empíricos: se realizan desde la observación, con experimentos directos. Son experimentales.", "ok": 3}, {"t": "Cualitativos: importa el comportamiento del fenómeno, la tendencia de este o el comportamiento de algunos atributos de este, sin importar su valor numérico. Cuantitativos: utilizan la matemática para determinar valores precisos del comportamiento del fenómeno, se pueden realizar operaciones y análisis complejos.", "ok": 2}, {"t": "Deterministas: es un valor preciso sin incertidumbre, partiendo de valores determinados ya conocidos. Estocásticos: hacen uso de la probabilidad, con cierta incertidumbre de éxito o fracaso.", "ok": 1}, {"t": "Simulación: utilizan herramientas heurísticas como probabilísticas para llegar a un resultado, los eventos se pueden medir (cuantitativo), prediciendo situaciones partiendo de valores reales del presente. Control: modelos matemáticos que son útiles para verificar el desempeño de un proceso o comportamiento de una o varias variables con parámetros de entrada y salida, así como variables con máximos y/o mínimos (fronteras de control). Optimización: son modelos matemáticos planteados, de acuerdo con una situación de una problemática específica, brindando varias posibilidades de respuesta, seleccionando generalmente las más conveniente en términos de costo, tiempo u otra variable representativa (el óptimo).", "ok": 0}], "ops": ["Por uso.", "Por aleatoriedad.", "Por tipo de representación.", "Por origen de la información."]}, {"n": 29, "tipo": "match", "tema": "Tablas y gráficos", "q": "Relacione la columna A con la B de acuerdo al tipo de gráfico enunciado.", "filas": [{"t": "Es la representación tipo cartesiano donde el eje X representa las categorías o atributos de la variable (cualitativa o cuantitativa), en el eje y se representan las frecuencias (cantidad que presentan estas categorías según los intervalos en que se encuentren), pueden ser verticales u horizontales, simples o dobles, en dos o tres ejes o dimensiones.", "ok": 2}, {"t": "Es una representación circular de las frecuencias relativas de una variable cualitativa o discreta que permite, de una manera sencilla y rápida, su comparación. El círculo representa la totalidad que se quiere observar (en el ejemplo, total de viajeros hospedados en hoteles) y cada porción, llamadas sectores, representan la proporción de cada categoría de la variable respecto al total. Suele expresarse en porcentajes, Son útiles cuando las categorías son pocas.", "ok": 0}, {"t": "Es el clásico gráfico de la línea recta, donde se tiene una variable dependiente, que puede tomar cualquiera valor y otra que depende del valor de la otra. Existe una correlación entre las dos variables, poder directo (ambas variables van en el mismo sentido, por ejemplo, si X, aumenta, Y igualmente aumenta) o inversas (si X aumenta, Y disminuye).", "ok": 1}, {"t": "Es una representación gráfica en un eje cartesiano de la relación que existe entre dos variables reflejando con claridad los cambios producidos. Se suelen usar para presentar tendencias temporales.", "ok": 3}, {"t": "Es un gráfico que representa mediante figuras o símbolos, las frecuencias de una variable cualitativa o discreta. Al igual que los gráficos de barras, suelen usarse para comparar magnitudes o ver la evolución en el tiempo de una categoría concreta.", "ok": 4}], "ops": ["Gráfico circular.", "Gráfico dispersión.", "Gráfico de barras.", "Gráfico de líneas.", "Pictograma."]}, {"n": 30, "tipo": "match", "tema": "Población y muestreo", "q": "Relacione la columna A con la B de acuerdo al tipo de muestra poblacional enunciada.", "filas": [{"t": "La población se encuentra ya agrupada previamente y de estos grupos se extraen los individuos para conformar la muestra.", "ok": 7}, {"t": "Es un conjunto de variables aleatorias independientes e idénticamente distribuidas, obtenidas a partir de la variable aleatoria X y que se distribuyen igual que la misma.", "ok": 4}, {"t": "En este caso la población se enumera y se agrupa en grupos de 10 personas. Posteriormente, se selecciona a un miembro de cada grupo para elaborar la muestra.", "ok": 0}, {"t": "Existe igual probabilidad de estar o no en la muestra por parte de todos los elementos o individuos.", "ok": 6}, {"t": "En este caso la población se divide en subgrupos o estratos con base en las variables de estratificación.", "ok": 3}, {"t": "Todos los elementos no tienen la misma probabilidad de ser elegidos.", "ok": 2}, {"t": "La selección de la población la realizan los investigadores en función a su propio criterio.", "ok": 5}, {"t": "La población es elegida en función a unas características determinadas.", "ok": 1}, {"t": "No aleatoriedad en la selección, esta depende del método y de la subjetividad del seleccionador.", "ok": 8}], "ops": ["Muestra aleatoria sistemática.", "Muestra por cuotas.", "Muestra no probabilística.", "Muestra estratificada.", "Muestra aleatoria simple.", "Bola de nieve", "Muestra aleatoria por conglomerados.", "Muestra probabilística.", "Muestra discrecional."]}];
const LET = "abcdefghij";
let idx = 0, ans = {}, fin = false;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function inicio(){
  $("#app").innerHTML = `<div class="card"><h2 style="margin-top:0">Cuestionario de práctica</h2>
  <p>Practica con <b>${Q.length} preguntas</b> del componente <i>Modelos matemáticos y estadísticos aplicados en Big Data</i>: opción múltiple, verdadero o falso y relacionar columnas.</p>
  <ul><li>Puedes moverte entre preguntas y cambiar tus respuestas antes de finalizar.</li>
  <li>Al terminar verás tu <b>resumen</b>: aciertos por pregunta, la respuesta correcta y los temas que debes repasar.</li>
  <li>Es solo práctica: <b>no se guarda nada</b>, todo ocurre en tu navegador y no afecta tu calificación.</li></ul>
  <button class="btn" onclick="empezar()">Empezar</button></div>`;
}
function empezar(){ idx = 0; ans = {}; fin = false; pregunta(); }

function respondida(i){
  const q = Q[i], a = ans[i];
  if(a === undefined) return false;
  if(q.tipo === "mc") return true;
  return q.filas.every((_, k) => a[k] !== undefined && a[k] !== "");
}
function pregunta(){
  const q = Q[idx];
  const hechas = Q.filter((_, i) => respondida(i)).length;
  let cuerpo = "";
  if(q.tipo === "mc"){
    cuerpo = q.ops.map((o, k) => `<label class="op ${ans[idx]===k?"sel":""}"><input type="radio" name="r" ${ans[idx]===k?"checked":""} onchange="marcar(${k})"><span>${q.ops.length>2?LET[k]+". ":""}${esc(o)}</span></label>`).join("");
  } else {
    cuerpo = q.filas.map((f, k) => `<div class="fila"><p>${esc(f.t)}</p><select onchange="marcarM(${k},this.value)"><option value="">Elegir...</option>${q.ops.map((o, j) => `<option value="${j}" ${(ans[idx]||{})[k]===j?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`).join("");
  }
  const grid = Q.map((_, i) => `<button class="${respondida(i)?"done":""} ${i===idx?"cur":""}" onclick="ir(${i})">${i+1}</button>`).join("");
  $("#app").innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Pregunta ${idx+1} de ${Q.length}</b><span class="nota">${hechas} de ${Q.length} respondidas</span></div>
  <div class="bar"><i style="width:${hechas/Q.length*100}%"></i></div><div class="grid">${grid}</div></div>
  <div class="card"><span class="tema">${esc(q.tema)}</span><p class="q">${q.tipo==="mc"?esc(q.q):"<b>"+esc(q.q)+"</b>"}</p>${cuerpo}
  <div class="nav"><button class="btn sec" onclick="ir(${idx-1})" ${idx===0?"disabled":""}>← Anterior</button>
  ${idx<Q.length-1?`<button class="btn" onclick="ir(${idx+1})">Siguiente →</button>`:`<button class="btn warn" onclick="finalizar()">Finalizar y ver resumen</button>`}</div></div>
  <p class="nota">Puedes finalizar cuando quieras: las preguntas sin responder cuentan como no acertadas.</p>
  ${idx<Q.length-1?`<button class="btn sec" onclick="finalizar()">Finalizar ahora</button>`:""}`;
  window.scrollTo(0, 0);
}
function ir(i){ if(i<0||i>=Q.length) return; idx = i; pregunta(); }
function marcar(k){ ans[idx] = k; pregunta(); }
function marcarM(k, v){ ans[idx] = ans[idx] || {}; ans[idx][k] = v === "" ? "" : Number(v); const y = window.scrollY; pregunta(); window.scrollTo(0, y); }

function puntos(i){
  const q = Q[i], a = ans[i];
  if(a === undefined) return 0;
  if(q.tipo === "mc") return a === q.ok ? 1 : 0;
  let c = 0; q.filas.forEach((f, k) => { if(a[k] === f.ok) c++; });
  return c / q.filas.length;
}
function finalizar(){
  const sin = Q.filter((_, i) => !respondida(i)).length;
  if(sin && !confirm(`Te faltan ${sin} pregunta(s) por responder. ¿Finalizar de todos modos?`)) return;
  fin = true; resumen();
}
function texto(i){
  const q = Q[i], a = ans[i];
  if(q.tipo === "mc"){
    const t = a === undefined ? "Sin responder" : (q.ops.length>2?LET[a]+". ":"")+q.ops[a];
    const c = (q.ops.length>2?LET[q.ok]+". ":"")+q.ops[q.ok];
    return [t, c];
  }
  return ["", ""];
}
function resumen(){
  let total = 0; const temas = {};
  Q.forEach((q, i) => { const p = puntos(i); total += p; (temas[q.tema] = temas[q.tema] || {p:0, n:0}); temas[q.tema].p += p; temas[q.tema].n += 1; });
  const pct = Math.round(total / Q.length * 100);
  const filas = Q.map((q, i) => {
    const p = puntos(i), est = p === 1 ? '<span class="ok">✓ Correcta</span>' : (p === 0 ? '<span class="no">✗ Incorrecta</span>' : `<span class="par">◐ Parcial (${Math.round(p*q.filas.length)}/${q.filas.length})</span>`);
    let det = "";
    if(q.tipo === "mc"){
      const [t, c] = texto(i);
      det = `<div><b>Tu respuesta:</b> ${esc(t)}</div>` + (p===1 ? "" : `<div><b>Correcta:</b> ${esc(c)}</div>`);
    } else {
      det = q.filas.map((f, k) => { const v = (ans[i]||{})[k]; const bien = v === f.ok; const tu = (v===undefined||v==="")?"Sin responder":q.ops[v];
        return `<div class="det">${bien?"✓":"✗"} ${esc(f.t.slice(0, 70))}… → <b>${esc(tu)}</b>${bien?"":" · Correcta: <b>"+esc(q.ops[f.ok])+"</b>"}</div>`; }).join("");
    }
    return `<tr><td><b>${i+1}</b></td><td>${est}</td><td><div class="det" style="margin:0 0 4px">${esc(q.tema)}</div>${det}${p<1&&q.exp?`<div class="det">💡 ${esc(q.exp)}</div>`:""}</td></tr>`;
  }).join("");
  const tm = Object.entries(temas).map(([t, v]) => { const x = Math.round(v.p / v.n * 100); return `<div class="tm"><div>${esc(t)}<div class="bar"><i style="width:${x}%;background:${x===100?"var(--v)":(x>=60?"#f59e0b":"var(--r)")}"></i></div></div><b>${Number.isInteger(v.p)?v.p:v.p.toFixed(1).replace('.',',')}/${v.n}</b></div>`; }).join("");
  const rep = Object.entries(temas).filter(([_, v]) => v.p < v.n).map(([t]) => t);
  $("#app").innerHTML = `<div class="card"><h2 style="margin-top:0">Tu resumen</h2><p class="score">${Number.isInteger(total)?total:total.toFixed(1).replace('.',',')} / ${Q.length}</p><p class="pct">${pct} % de aciertos ${pct===100?"· ¡Excelente! Estás listo para Zajuna.":(pct>=70?"· Muy bien, repasa los temas marcados.":"· Repasa los temas marcados y vuelve a intentarlo.")}</p>
  <div class="nav noprint"><button class="btn" onclick="empezar()">Repetir el cuestionario</button><button class="btn sec" onclick="window.print()">Imprimir o guardar en PDF</button><button class="btn sec" onclick="verFalladas()">Ver solo las falladas</button></div></div>
  <div class="card"><h3 style="margin-top:0">Resultado por tema</h3>${tm}
  ${rep.length?`<div class="rep"><b>Temas para repasar:</b> ${rep.map(esc).join(" · ")}</div>`:`<div class="rep" style="background:var(--gb);border-color:var(--v)"><b>No tienes temas pendientes.</b></div>`}</div>
  <div class="card"><h3 style="margin-top:0">Detalle por pregunta</h3><table id="det"><thead><tr><th>#</th><th>Resultado</th><th>Detalle</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="nota">Práctica local: no se guardó nada. Al cerrar o recargar la página se pierde este resumen.</p></div>`;
  window.scrollTo(0, 0);
}
function verFalladas(){
  document.querySelectorAll("#det tbody tr").forEach((tr, i) => { tr.style.display = puntos(i) === 1 ? "none" : ""; });
}
inicio();
</script></body></html>
